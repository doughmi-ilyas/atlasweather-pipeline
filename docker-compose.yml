name: atlasweather

services:
  postgres:
    image: postgres:18
    container_name: atlas-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  streamlit:
    image: python:3.11-slim
    container_name: atlas-streamlit
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: >
      sh -c "pip install -r requirements.txt && streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - postgres

  airflow:
    image: apache/airflow:2.8.1-python3.11
    container_name: atlas-airflow
    restart: unless-stopped
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas
      - DB_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./extraction:/opt/airflow/extraction
      - ./transformation:/opt/airflow/transformation
      - ./gold:/opt/airflow/gold
      - ./load:/opt/airflow/load
      - ./data:/opt/airflow/data
      - ./bronze:/opt/airflow/bronze
      - ./silver:/opt/airflow/silver
      - ./sql:/opt/airflow/sql
    ports:
      - "8080:8080"
    command: standalone
    depends_on:
      - postgres

volumes:
  postgres_data: